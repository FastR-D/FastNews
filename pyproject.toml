[project]
name = "fastnews"
version = "0.1.0"
description = "自动收集安全资讯与顶会论文，经 LLM 总结后生成周报与研究报告"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "feedparser>=6.0.12",
    "jinja2>=3.1.6",
    "openai>=2.16.0",
    "python-dotenv>=1.2.1",
    "requests>=2.32.5",
    "retry==0.9.2",
    "weasyprint>=62.0",
]
