name: Top conference report

on:
  workflow_dispatch:
    inputs:
      conference:
        description: Conference
        required: true
        default: usenix
        type: choice
        options: [usenix, ieee-sp, ndss, ccs]
      year:
        description: Conference year
        required: true
        default: '2026'
        type: string

permissions:
  contents: write
concurrency:
  group: fastnews-data-commit
  cancel-in-progress: false

jobs:
  report:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CONFERENCE: ${{ inputs.conference }}
      YEAR: ${{ inputs.year }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build -trimpath -o bin/fastnews ./cmd/fastnews
      - name: Fetch official paper records
        run: ./bin/fastnews fetch-conf --conference "$CONFERENCE" --year "$YEAR"
      - name: Generate resumable summaries
        run: ./bin/fastnews summarize-conf --conference "$CONFERENCE" --year "$YEAR"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - name: Generate HTML and PDF
        run: |
          export FASTNEWS_CHROME="$(pnpm --dir web exec node -e 'console.log(require("@playwright/test").chromium.executablePath())')"
          ./bin/fastnews conference-report --conference "$CONFERENCE" --year "$YEAR" --pdf
      - name: Commit conference records and summary checkpoints
        if: ${{ !cancelled() }}
        env:
          FASTNEWS_DATA_COMMIT_MESSAGE: 'data: update conference report and checkpoints'
        run: ./scripts/commit-data.sh top-conf/data/
      - name: Publish this conference report
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: report-${{ inputs.conference }}-${{ inputs.year }}
        run: |
          case "$CONFERENCE" in
            usenix) PREFIX=USENIX ;;
            ieee-sp) PREFIX=IEEE-SP ;;
            ndss) PREFIX=NDSS ;;
            ccs) PREFIX=CCS ;;
            *) exit 2 ;;
          esac
          REPORT="top-conf/data/report/${PREFIX}_${YEAR}_Report"
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$REPORT.html" "$REPORT.pdf" --clobber
          else
            gh release create "$RELEASE_TAG" "$REPORT.html" "$REPORT.pdf" \
              --target main --title "$PREFIX $YEAR Summary" --notes '安全顶会论文中文报告。'
          fi
