name: Go and React CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fastnews-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FASTNEWS_TEST_POSTGRES_DSN: postgres://postgres:fastnews-ci-only@127.0.0.1:5432/postgres?sslmode=disable
    timeout-minutes: 30
    concurrency:
      group: fastnews-ci-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: make install
      - run: make test
      - run: pnpm --dir web format:check
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - name: Desktop, mobile, subpath and private-report browser contracts
        run: make test-browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-diagnostics
          path: web/test-results/
          if-no-files-found: ignore
