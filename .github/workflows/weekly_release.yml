name: Weekly news report

on:
  schedule:
    - cron: '0 6 * * 6'
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: fastnews-data-commit
  cancel-in-progress: false

jobs:
  report:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build -trimpath -o bin/fastnews ./cmd/fastnews
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm --dir web install --frozen-lockfile
      - run: pnpm --dir web exec playwright install --with-deps chromium
      - name: Generate weekly HTML and PDF
        run: |
          export FASTNEWS_CHROME="$(pnpm --dir web exec node -e 'console.log(require("@playwright/test").chromium.executablePath())')"
          ./bin/fastnews weekly-report --days 7 --pdf
      - name: Commit the HTML report
        if: ${{ !cancelled() }}
        env:
          FASTNEWS_DATA_COMMIT_MESSAGE: 'data: generate weekly news report'
        run: ./scripts/commit-data.sh secnews/data/report/
      - name: Publish or update weekly assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="release-$(date -u +'%Y-%m-%d')"
          TITLE="FastNews 安全资讯周报 $(date -u +'%Y-%m-%d')"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" output/*.html output/*.pdf --clobber
          else
            gh release create "$TAG" output/*.html output/*.pdf \
              --target main --title "$TITLE" --notes '安全资讯周报 PDF 与 HTML。'
          fi
