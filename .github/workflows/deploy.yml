name: Deploy FastNews

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-fastnews
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      LIVE_ROOT: /home/dev/FastNews
      RELEASES_ROOT: /home/dev/ci-releases/fastnews
      UNIT: fastnews.service
    steps:
      - uses: actions/checkout@v4

      - name: Patch serve.py for system Python
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path("serve.py")
          text = path.read_text(encoding="utf-8")
          old = "from dotenv import load_dotenv\n"
          new = (
              "try:\n"
              "    from dotenv import load_dotenv\n"
              "except ImportError:\n"
              "    def load_dotenv(*_args, **_kwargs):\n"
              "        return False\n"
          )
          if "except ImportError:" in text and "def load_dotenv" in text:
              print("serve.py already patched")
          elif old in text:
              path.write_text(text.replace(old, new, 1), encoding="utf-8")
              print("patched serve.py dotenv import")
          else:
              print("serve.py has no dotenv import; left unchanged")
          PY

      - name: Pack release
        run: |
          tar --exclude-vcs \
              --exclude='.github' \
              --exclude='.venv' \
              --exclude='.env' \
              --exclude='.agents' \
              --exclude='.vscode' \
              --exclude='__pycache__' \
              --exclude='.pytest_cache' \
              --exclude='output' \
              --exclude='*.pyc' \
              --exclude='*.pyo' \
              -czf /tmp/fastnews.tar.gz .
          ls -lh /tmp/fastnews.tar.gz

      - name: Check deploy secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          missing=0
          [ -n "$DEPLOY_HOST" ] || { echo "missing secret DEPLOY_HOST"; missing=1; }
          [ -n "$DEPLOY_USER" ] || { echo "missing secret DEPLOY_USER"; missing=1; }
          [ -n "$DEPLOY_SSH_KEY" ] || { echo "missing secret DEPLOY_SSH_KEY"; missing=1; }
          exit "$missing"

      - name: Prepare SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/deploy_key"
          chmod 600 "$HOME/.ssh/deploy_key"
          if [ -n "$DEPLOY_KNOWN_HOSTS" ]; then
            printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          else
            ssh-keyscan -H "$DEPLOY_HOST" >> "$HOME/.ssh/known_hosts"
          fi
          chmod 600 "$HOME/.ssh/known_hosts"
          {
            echo "Host deploy"
            echo "  HostName $DEPLOY_HOST"
            echo "  User $DEPLOY_USER"
            echo "  IdentityFile $HOME/.ssh/deploy_key"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking yes"
            echo "  BatchMode yes"
          } > "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"

      - name: Upload and apply
        env:
          RELEASE_ID: news-${{ github.run_id }}-${{ github.sha }}
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          Path("/tmp/ci-sync-release.py").write_bytes(base64.b64decode(""))
          Path("/tmp/ci-health.py").write_bytes(base64.b64decode(""))
          Path("/tmp/ci-apply.py").write_bytes(base64.b64decode(""))
          print("wrote remote helpers")
          PY
          scp /tmp/ci-sync-release.py /tmp/ci-health.py /tmp/ci-apply.py deploy:/tmp/

          RELEASE_DIR="$RELEASES_ROOT/$RELEASE_ID"
          BACKUP_DIR="$RELEASES_ROOT/backups/$RELEASE_ID"
          ssh deploy "mkdir -p '$RELEASE_DIR/extract' '$RELEASES_ROOT/backups'"
          scp /tmp/fastnews.tar.gz deploy:"$RELEASE_DIR/release.tar.gz"
          ssh deploy "python3 /tmp/ci-apply.py '$RELEASE_DIR/release.tar.gz' '$RELEASE_DIR/extract' '$LIVE_ROOT' '$BACKUP_DIR' '$RELEASES_ROOT' '.env,.git,__pycache__,.venv' '' purge '$UNIT' 'http://127.0.0.1:8788/' 'http://127.0.0.1/news/'"
