name: Fetch news

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: fastnews-data-commit
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build -trimpath -o bin/fastnews ./cmd/fastnews
      - run: ./bin/fastnews fetch-news --source bleepingcomputer
      - run: ./bin/fastnews fetch-news --source arxiv_cs_cr
      - run: ./bin/fastnews fetch-news --source arxiv_cs_ai
      - name: Commit fetched records, including partial progress
        if: ${{ !cancelled() }}
        env:
          FASTNEWS_DATA_COMMIT_MESSAGE: 'data: fetch daily news'
        run: ./scripts/commit-data.sh secnews/data/articles/
