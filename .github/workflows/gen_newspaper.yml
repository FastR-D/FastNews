name: Summarize daily news

on:
  schedule:
    - cron: '30 22 * * *'
  workflow_dispatch:

permissions:
  contents: write
concurrency:
  group: fastnews-data-commit
  cancel-in-progress: false

jobs:
  summarize:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go build -trimpath -o bin/fastnews ./cmd/fastnews
      - run: ./bin/fastnews daily-summary
      - run: ./bin/fastnews newspaper
      - name: Commit summaries, including interrupted checkpoints
        if: ${{ !cancelled() }}
        env:
          FASTNEWS_DATA_COMMIT_MESSAGE: 'data: summarize daily news'
        run: ./scripts/commit-data.sh secnews/data/daily_summaries/ secnews/data/newspapers/
