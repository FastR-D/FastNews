name: Validate and deploy FastNews

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    concurrency:
      group: validate-fastnews-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@v6
      - name: Export locked production dependencies, including FastCAS
        run: uv export --frozen --no-dev --extra fastcas --no-emit-project --output-file "$RUNNER_TEMP/fastnews-requirements.txt"
      - run: python -m pip install --target vendor -r "$RUNNER_TEMP/fastnews-requirements.txt"
      - run: python -m pip install pytest
      - run: python -m pytest
        env:
          PYTHONPATH: vendor
      - name: Checkout pinned FastDeploy packager
        uses: actions/checkout@v4
        with:
          repository: FastR-D/FastDeploy
          ref: 9a2c51dcd63f47a0e6c8f6bb07bd22ea589abbd2
          path: .fastdeploy-tools
          persist-credentials: false
      - name: Package the tested runtime
        run: python3 .fastdeploy-tools/scripts/package.py fastnews --output "$RUNNER_TEMP/fastnews-release"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: ${{ runner.temp }}/fastnews-release/
          if-no-files-found: error
          retention-days: 7

  deploy:
    needs: validate
    if: startsWith(github.ref, 'refs/tags/v')
    uses: FastR-D/FastDeploy/.github/workflows/deploy.yml@9a2c51dcd63f47a0e6c8f6bb07bd22ea589abbd2
    with:
      app: fastnews
      artifact-name: release-${{ github.sha }}
      # These values are literal KEY=value entries; do not add shell quotes.
      # Code-relative paths are supplied by the trusted FastDeploy server profile.
      runtime-env: |
        FASTNEWS_DATA_DIR=/home/dev/FastNews/.fastnews-data
        FASTNEWS_FASTCAS_ALLOW_LOOPBACK_HTTP=false
        FASTNEWS_FASTCAS_CLIENT_ID=news
        FASTNEWS_FASTCAS_ISSUER=https://cas.fastrd.io
        FASTNEWS_FASTCAS_REDIRECT_URI=https://news.fastrd.io/api/auth/fastcas/callback
        FASTNEWS_HOST=127.0.0.1
        FASTNEWS_PORT=8788
        FASTNEWS_PUBLIC_ORIGIN=https://news.fastrd.io
        FASTNEWS_PUBLIC_PATH=/news
        FASTNEWS_ROOT=/home/dev/FastNews
        FASTREAD_URL=https://fastrd.io/read
        FASTRESEARCH_API_URL=http://127.0.0.1:8787
        FASTRESEARCH_COOKIE_NAME=fr_session
        FASTRESEARCH_PANEL_URL=https://fastrd.io
        LLM_MODEL=deepseek-flash
        OPENAI_BASE_URL=https://api.deepseek.com
        PYTHONUNBUFFERED=1
    secrets:
      SSH_HOST: ${{ secrets.FASTRD_SSH_HOST }}
      SSH_PORT: ${{ secrets.FASTRD_SSH_PORT }}
      SSH_USER: ${{ secrets.FASTRD_SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.FASTRD_SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.FASTRD_SSH_KNOWN_HOSTS }}
      runtime-secrets: |
        {
          "FASTINSIGHT_INGEST_KEY": ${{ toJSON(secrets.FASTINSIGHT_INGEST_KEY) }},
          "FASTNEWS_FASTCAS_CLIENT_SECRET": ${{ toJSON(secrets.FASTNEWS_FASTCAS_CLIENT_SECRET) }},
          "OPENAI_API_KEY": ${{ toJSON(secrets.OPENAI_API_KEY) }}
        }
