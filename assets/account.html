<section id="research" hidden><h2>连接 FastResearch</h2><p>使用 Research Key 验证原账号，并将当前的关注作者、研究印象和收件箱复制到此 FastNews 账号。Key 不会保存在 FastNews；导入后两边内容各自独立。</p><p id="research-state"></p><label>Research Key<input id="research-key" type="password" maxlength="256" autocomplete="off"></label><label><input id="research-replace" type="checkbox"> 明确覆盖本账号已有的这三类个人内容</label><button id="research-import">验证并导入快照</button><div id="research-cas" hidden><p>FastCAS 已授权时，也可以实时读取 Research 资料，或明确复制一份到本地。</p><button id="research-live">查看实时资料</button> <button id="research-sync">使用 FastCAS 导入快照</button></div></section>
