<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FastNews · 账号</title>
<style>body{margin:0;background:#f3f7f5;color:#15352b;font:16px system-ui}main{max-width:430px;margin:8vh auto;padding:32px;background:white;border:1px solid #d1e0d8;border-radius:16px}h1{font-size:26px}label{display:block;margin:18px 0}input{display:block;box-sizing:border-box;width:100%;padding:12px;margin-top:7px;border:1px solid #9fb7aa;border-radius:6px;font:inherit}input[type=checkbox]{display:inline;width:auto;padding:0;margin:0 6px 0 0}button,a{font:inherit}button{padding:10px 16px;border:1px solid #2b7054;border-radius:6px;background:#245c45;color:white;cursor:pointer}button:disabled{opacity:.5}nav{display:flex;gap:8px;margin-top:22px}nav button{background:white;color:#245c45}p{line-height:1.6}a{color:#245c45}[hidden]{display:none!important}</style>
<main><a id="home">← 返回报告</a><h1 id="title">登录 FastNews</h1><p>使用本项目账号登录。邀请注册和账号恢复凭证由实例管理员提供。</p><p id="message" role="status"></p><section id="signed" hidden><p id="identity"></p><button id="logout">退出本地账号</button></section>
<form id="form"><label id="email-label">邮箱<input id="email" type="email" autocomplete="username" required maxlength="254"></label><label id="token-label" hidden>一次性凭证<input id="token" maxlength="256"></label><label>密码<input id="password" type="password" autocomplete="current-password" required maxlength="256"></label><button id="submit">登录</button></form>
<section id="cas" hidden><h2>FastCAS</h2><a id="cas-login">使用 FastCAS 登录</a><div id="cas-account" hidden><p id="cas-state"></p><label>本地密码<input id="cas-password" type="password" maxlength="256" autocomplete="current-password"></label><button id="cas-link">认证当前账号</button> <button id="cas-reconcile" hidden>重试完成认证</button> <button id="cas-revoke" hidden>解除认证</button></div></section>
<section id="research" hidden><h2>连接 FastResearch</h2><p>使用 Research Key 验证原账号，并将当前的关注作者、研究印象和收件箱复制到此 FastNews 账号。Key 不会保存在 FastNews；导入后两边内容各自独立。</p><p id="research-state"></p><label>Research Key<input id="research-key" type="password" maxlength="256" autocomplete="off"></label><label><input id="research-replace" type="checkbox"> 明确覆盖本账号已有的这三类个人内容</label><button id="research-import">验证并导入快照</button><div id="research-cas" hidden><p>FastCAS 已授权时，也可以实时读取 Research 资料，或明确复制一份到本地。</p><button id="research-live">查看实时资料</button> <button id="research-sync">使用 FastCAS 导入快照</button></div></section>
<nav id="modes"><button data-mode="login">登录</button><button data-mode="register">邀请注册</button><button data-mode="recover">恢复账号</button></nav></main>
<script>
const base=__FASTNEWS_BASE__;
const $=id=>document.getElementById(id);let mode='login',csrf='',currentUser=null;
$('home').href=base+'/';
async function api(path,method='GET',body,token=''){const response=await fetch(base+path,{method,credentials:'same-origin',headers:{...(body?{'Content-Type':'application/json'}:{}),...(token?{'X-CSRF-Token':token}:{})},body:body?JSON.stringify(body):undefined});const value=await response.json();if(!response.ok)throw new Error(value.error||'请求未完成');return value;}
function setMode(next){mode=next;const login=mode==='login';$('email-label').hidden=!login;$('email').required=login;$('token-label').hidden=login;$('token').required=!login;$('password').minLength=login?1:12;$('password').autocomplete=login?'current-password':'new-password';$('password').value='';$('token').value='';$('title').textContent=login?'登录 FastNews':mode==='register'?'邀请注册':'恢复账号';$('submit').textContent=login?'登录':'设置密码';$('message').textContent='';}
document.querySelectorAll('[data-mode]').forEach(button=>button.onclick=()=>setMode(button.dataset.mode));
$('form').onsubmit=async event=>{event.preventDefault();$('submit').disabled=true;$('message').textContent='';try{const init=await api('/api/auth/session-init');await api('/api/auth/'+mode,'POST',mode==='login'?{email:$('email').value,password:$('password').value}:{token:$('token').value,password:$('password').value},init.csrf);if(mode==='login')location.assign(base+'/');else{setMode('login');$('message').textContent='密码已设置，请登录。';}}catch(error){$('message').textContent=error.message;}finally{$('submit').disabled=false;}};
const userReady=api('/api/auth/me').then(user=>{currentUser=user;csrf=user.csrf;$('signed').hidden=false;$('identity').textContent='当前账号：'+user.email;$('form').hidden=true;$('modes').hidden=true;}).catch(()=>{});
$('logout').onclick=async()=>{try{await api('/api/auth/logout','POST',{},csrf);location.reload();}catch(error){$('message').textContent=error.message;}};

async function casStatus(){const value=await api('/api/auth/fastcas/status');$('cas-state').textContent=value.link?(value.link.state==='active'?'已通过 FastCAS 认证':'认证待完成'):'尚未认证';$('cas-link').hidden=Boolean(value.link);$('cas-revoke').hidden=!value.link;$('cas-reconcile').hidden=value.link?.state!=='prepared';}
Promise.all([userReady,api('/api/auth/fastcas/available')]).then(async ([_,provider])=>{if(!provider.enabled)return;$('cas').hidden=false;$('cas-login').href=base+'/api/auth/fastcas/login';if(currentUser){$('cas-login').hidden=true;$('cas-account').hidden=false;await casStatus();}}).catch(error=>{$('message').textContent=error.message;});
for(const action of ['link','reconcile','revoke'])$('cas-'+action).onclick=async()=>{const button=$('cas-'+action);button.disabled=true;try{const value=await api('/api/auth/fastcas/'+action,'POST',{password:$('cas-password').value},csrf);$('cas-password').value='';if(value.url)location.assign(value.url);else if(action==='revoke'&&currentUser?.source==='fastcas')location.reload();else await casStatus();}catch(error){$('message').textContent=error.message;}finally{button.disabled=false;}};
userReady.then(async()=>{if(!currentUser)return;$('research').hidden=false;const status=await api('/api/auth/research/status');$('research-state').textContent=status.connection?`已从 Research 账号 ${status.connection.research_account_id} 导入；上次导入 ${new Date(status.connection.imported*1000).toLocaleString()}`:'尚未导入 Research 内容';$('research-cas').hidden=!status.casLive;}).catch(error=>{$('message').textContent=error.message;});
$('research-import').onclick=async()=>{const button=$('research-import');button.disabled=true;$('message').textContent='';try{const value=await api('/api/auth/research/import','POST',{key:$('research-key').value,replace:$('research-replace').checked},csrf);$('research-state').textContent=`已导入 ${value.connection.counts.authors} 位关注作者、${value.connection.counts.inbox} 条收件箱内容。`;$('research-replace').checked=false;}catch(error){$('message').textContent=error.message;}finally{$('research-key').value='';button.disabled=false;}};
$('research-live').onclick=async()=>{const button=$('research-live');button.disabled=true;$('message').textContent='';try{const value=await api('/api/auth/research/live');$('research-state').textContent=`Research 实时资料：${value.authors.length} 位关注作者、${value.inbox.length} 条收件箱内容；研究印象：${(value.impression?.text||'暂无').slice(0,120)}`;}catch(error){$('message').textContent=error.message;}finally{button.disabled=false;}};
$('research-sync').onclick=async()=>{const button=$('research-sync');button.disabled=true;$('message').textContent='';try{const value=await api('/api/auth/research/sync','POST',{replace:$('research-replace').checked},csrf);$('research-state').textContent=`已从 Research 账号 ${value.connection.researchAccountId} 导入 ${value.connection.counts.authors} 位关注作者、${value.connection.counts.inbox} 条收件箱内容。`;$('research-replace').checked=false;}catch(error){$('message').textContent=error.message;}finally{button.disabled=false;}};
const result=new URLSearchParams(location.search).get('fastcas');if(result)$('message').textContent=result==='complete'?'FastCAS 操作已完成':'FastCAS 操作未完成，请登录本地账号后检查认证状态。';
</script></html>
